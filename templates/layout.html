<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% if title %}
            {{ title }}
        {% else %}
            Home
        {% endif %}
    </title>
    <link rel="stylesheet" href="/static/css/aac-practice.css?v=available-strip-gap-1">
</head>
<body class="{% block body_class %}{% endblock body_class %}">
    <header class="site-header">
        <a class="brand" href="/" aria-label="Word Path home">Word Path</a>
    </header>
    {% block content %}
    {% endblock content %}
    <div class="landscape-message" role="status" aria-live="polite">
        <p>Rotate your device to landscape to use Word Path.</p>
    </div>
</body>
</html>
